# Per-site nginx rules for woocommercesmartorder.loc.
#
# OSPanel includes this file inside the host's server block, so it survives
# regeneration of nginx.conf (which is generated and must not be edited by hand).
#
# What it fixes: without these rules .git/config and .codewhale/handoff.md were
# readable over HTTP, which exposes the whole commit history and the notes about the
# deployment.

# Hidden files and folders: .git, .codewhale, .env, .editorconfig …
# .well-known stays open for ACME challenges.
location ~* /\.(?!well-known/) {
    deny all;
}

# Backup, config, log and dump files that editors and tools leave behind.
location ~* (?:\.(?:bak|co?nf(ig)?|in[ci]|log|sh|sql|tar|t?gz)|~)$ {
    deny all;
}

# No directory listings.
autoindex off;

# PHP must never execute in uploads: that is where user-supplied files land.
location ~* ^/wp-content/uploads/.*\.(?:php|phtml|php[0-9]|phar)$ {
    deny all;
}